<!DOCTYPE html><html><head><meta charset="utf-8"><style>
@font-face {{ font-family: Fell; src: url({fontdir}/IMFeENrm28P.ttf); }}
@font-face {{ font-family: Fell; font-style: italic; src: url({fontdir}/IMFeENit28P.ttf); }}
@font-face {{ font-family: FellSC; src: url({fontdir}/IMFeENsc28P.ttf); }}
@font-face {{ font-family: Fraktur; src: url({fontdir}/UnifrakturMaguntia-Book.ttf); }}
html, body {{ margin:0; width:1264px; height:1680px; background:#efe6d2; color:#2a2318; font-family:Fell, serif; overflow:hidden; }}
.cover {{ box-sizing:border-box; width:100%; height:100%; padding:64px; }}
.frame {{ box-sizing:border-box; height:100%; border:8px solid #2a2318; outline:4px solid #2a2318; outline-offset:-28px;
  padding:96px 72px; display:flex; flex-direction:column; align-items:center; text-align:center; }}
.sm {{ font-family:FellSC; font-size:46px; letter-spacing:.2em; }}
.orn {{ font-size:90px; color:#2f5a3a; margin:18px 0; }}
.mast {{ width:100%; margin:24px 0; }}
.meta {{ display:flex; justify-content:space-between; text-align:left; font-family:FellSC; font-size:40px; letter-spacing:.08em; gap:30px; }}
.meta span:last-child {{ text-align:right; }}
.rule {{ border-top:12px double #2a2318; margin:22px 0; }}
.name {{ font-family:Fraktur; font-size:178px; line-height:1.02; margin:36px 0 22px; }}
.red {{ color:#8a1c1c; }}
.lead {{ font-style:italic; font-size:66px; line-height:1.25; margin-top:56px; padding:0 20px; }}
.bottom {{ margin-top:auto; }}
</style></head><body><div class="cover"><div class="frame">
<div class="sm">Being a Record of the Day</div>
<div class="orn">❦</div>
<div class="mast">
  <div class="meta"><span>No. {no}</span><span>{day}</span></div>
  <div class="rule"></div>
  <div class="name">The Daily Brief</div>
  <div class="rule"></div>
  <div class="meta"><span>{topics}</span><span class="red">Edition of the Morning</span></div>
</div>
<div class="lead">{lead}</div>
<div class="bottom"><div class="orn">⁂</div><div class="sm">{roman}</div></div>
</div></div></body></html>
